name: 🚀 Build & Release TimberDry Pro (Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version (e.g. v2.6.0)'
        required: true
        default: 'v2.6.0'

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. BUILD ANDROID APK
  # ==========================================
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔨 Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: 📤 Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  # ==========================================
  # 2. PUBLISH GITHUB RELEASE
  # ==========================================
  publish-release:
    name: 🏷️ Publish Android GitHub Release
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release_assets/

      - name: 🏷️ Determine Tag Name
        id: tag_info
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            echo "TAG_NAME=${{ github.event.inputs.version_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: "🪵 TimberDry Pro ${{ steps.tag_info.outputs.TAG_NAME }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release_assets/*.apk
